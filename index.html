<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linear Control Systems — Course Companion</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>

<style>
:root{
  --accent:#1F4E79; --accent-2:#2E6DA4; --bg:#ffffff; --panel:#F7FAFC;
  --line:#D7E1EA; --text:#1A2028; --muted:#5A6675; --ok:#1B7A47; --warn:#8C2F00;
  --radius:8px; --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--sans);color:var(--text);background:var(--bg);line-height:1.55}
a{color:var(--accent-2)}
header{background:var(--accent);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{font-size:17px;margin:0;font-weight:600;letter-spacing:.2px}
header .sub{font-size:12.5px;opacity:.8}
#search{margin-left:auto;padding:7px 11px;border-radius:var(--radius);border:1px solid rgba(255,255,255,.35);
  background:rgba(255,255,255,.12);color:#fff;font-size:13px;width:230px}
#search::placeholder{color:rgba(255,255,255,.7)}

.layout{display:flex;align-items:flex-start;max-width:1400px;margin:0 auto}
nav{width:250px;flex:0 0 250px;border-right:1px solid var(--line);padding:16px 0;position:sticky;top:0;
  max-height:100vh;overflow-y:auto}
nav h2{font-size:11px;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);margin:0 0 8px 18px}
nav button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 18px;cursor:pointer;
  font-size:14px;font-family:inherit;color:var(--text);border-left:3px solid transparent}
nav button:hover{background:var(--panel)}
nav button.active{background:var(--panel);border-left-color:var(--accent);font-weight:600;color:var(--accent)}
nav button .ch-meta{display:block;font-size:11.5px;color:var(--muted);font-weight:400}
nav .prog{height:3px;background:var(--line);margin:5px 18px 0;border-radius:2px;overflow:hidden}
nav .prog span{display:block;height:100%;background:var(--ok)}

main{flex:1;padding:22px 34px 80px;min-width:0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 20px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 15px;cursor:pointer;
  font-size:14px;font-family:inherit;color:var(--muted)}
.tabs button.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}

h2.chap{margin:0 0 2px;font-size:23px;color:var(--accent)}
.chap-sub{color:var(--muted);font-size:13.5px;margin-bottom:16px}

.guide-sec{border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;overflow:hidden}
.guide-sec>summary{cursor:pointer;padding:11px 15px;background:var(--panel);font-weight:600;font-size:15px;
  color:var(--accent);list-style:none}
.guide-sec>summary::-webkit-details-marker{display:none}
.guide-sec>summary::before{content:"▸ ";color:var(--muted)}
.guide-sec[open]>summary::before{content:"▾ "}
.guide-body{padding:6px 18px 14px}
.guide-body h3{font-size:15px;color:var(--accent);margin:16px 0 6px}
.guide-body h4{font-size:14px;margin:14px 0 5px}
.guide-body table{border-collapse:collapse;margin:10px 0;font-size:14px}
.guide-body th,.guide-body td{border:1px solid var(--line);padding:6px 10px;text-align:left}
.guide-body th{background:var(--panel)}
.guide-body code{background:var(--panel);padding:1px 5px;border-radius:4px;font-size:13px}
.guide-body blockquote{border-left:3px solid var(--accent);background:var(--panel);margin:10px 0;
  padding:8px 14px;border-radius:0 var(--radius) var(--radius) 0}

.formula-list{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.formula-row{display:flex;align-items:center;gap:16px;padding:9px 14px;border-bottom:1px solid var(--line)}
.formula-row:last-child{border-bottom:0}
.formula-row:nth-child(even){background:var(--panel)}
.formula-eq{flex:0 0 auto;min-width:200px}
.formula-row .note{font-size:12.5px;color:var(--muted);text-align:right;margin-left:auto}
@media(max-width:700px){
  .formula-row{flex-direction:column;align-items:flex-start;gap:4px}
  .formula-row .note{text-align:left;margin-left:0}
}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px;font-size:13px}
.filters select{padding:6px 9px;border:1px solid var(--line);border-radius:var(--radius);font-family:inherit;font-size:13px}
.pbar{flex:1;min-width:130px;height:7px;background:var(--line);border-radius:4px;overflow:hidden}
.pbar span{display:block;height:100%;background:var(--ok)}
.pcount{color:var(--muted);font-size:12.5px;white-space:nowrap}

.prob{border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px;overflow:hidden}
.prob.done{border-color:var(--ok)}
.prob-head{display:flex;gap:10px;align-items:baseline;padding:11px 15px;background:var(--panel);flex-wrap:wrap}
.prob-num{font-weight:700;color:var(--accent);font-size:14px}
.tag{font-size:11px;text-transform:uppercase;letter-spacing:.6px;padding:2px 7px;border-radius:10px;
  border:1px solid var(--line);background:#fff;color:var(--muted)}
.tag.warmup{border-color:#9BC7A6;color:#1B7A47}
.tag.core{border-color:#9BB6D4;color:var(--accent)}
.tag.challenge{border-color:#D9A78C;color:var(--warn)}
.prob-body{padding:13px 16px}
.prob-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
button.act{font-family:inherit;font-size:13px;padding:6px 13px;border-radius:var(--radius);
  border:1px solid var(--accent);background:#fff;color:var(--accent);cursor:pointer}
button.act:hover{background:var(--accent);color:#fff}
button.act.done{border-color:var(--ok);color:var(--ok)}
button.act.done:hover{background:var(--ok);color:#fff}
.reveal{margin-top:13px;padding:12px 15px;border-radius:var(--radius);background:var(--panel);
  border-left:3px solid var(--accent)}
.reveal.expert{background:#FBF7EF;border-left-color:#A9762B}
.reveal.expert h4{color:#8A5F1E}
button.act.expert{border-color:#A9762B;color:#8A5F1E}
button.act.expert:hover{background:#A9762B;color:#fff}
.reveal h4{margin:0 0 7px;font-size:13px;text-transform:uppercase;letter-spacing:.7px;color:var(--accent)}
.hidden{display:none}

.empty{color:var(--muted);padding:30px 0;font-size:14px}
.katex{font-size:1.03em}
.katex-display{overflow-x:auto;overflow-y:hidden;padding:3px 0}

@media(max-width:860px){
  .layout{flex-direction:column}
  nav{width:100%;flex:auto;position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line)}
  main{padding:18px 16px 60px}
  #search{width:100%;margin:8px 0 0}
}
@media print{
  nav,header,.tabs,.filters,.prob-actions{display:none}
  .hidden{display:block!important}
  main{padding:0}
}
</style>
</head>
<body>

<header>
  <div>
    <h1>Linear Control Systems — Course Companion</h1>
    <div class="sub">Chapter guides, formula sheets, and worked problem sets</div>
  </div>
  <input id="search" type="search" placeholder="Search problems and notes…">
</header>

<div class="layout">
  <nav id="nav"><h2>Chapters</h2></nav>
  <main id="main"></main>
</div>

<script>
/* ============================================================
   Content registry. Each file in chapters/ calls registerChapter().
   ============================================================ */
const CHAPTERS = [];
let REFERENCE = null;
function registerChapter(ch){ CHAPTERS.push(ch); }
function registerReference(ref){ REFERENCE = ref; }
</script>

<script src="reference.js"></script>

<!-- Add one line per chapter file -->
<script src="chapters/ch01.js"></script>
<script src="chapters/ch02.js"></script>
<script src="chapters/ch04.js"></script>

<script>
/* ============================================================
   State
   ============================================================ */
const STORE_KEY = 'lcs-companion:v1';
let state = { view: 'chapter', chapter: 0, tab: 'guide', solved: {}, query: '', diff: 'all', topic: 'all' };

function loadProgress(){
  try { state.solved = JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }
  catch(e){ state.solved = {}; }
}
function saveProgress(){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state.solved)); } catch(e){}
}

/* ============================================================
   Markdown + KaTeX. Math is extracted before marked() runs so that
   underscores, backslashes and asterisks inside LaTeX survive.
   ============================================================ */
function mdMath(src){
  if(!src) return '';
  const vault = [];
  const stash = m => { vault.push(m); return '@@M' + (vault.length - 1) + '@@'; };

  let s = String(src)
    .replace(/\$\$([\s\S]*?)\$\$/g, stash)      // display  $$...$$
    .replace(/\\\[([\s\S]*?)\\\]/g, stash)      // display  \[...\]
    .replace(/\\\(([\s\S]*?)\\\)/g, stash)      // inline   \(...\)
    .replace(/\$([^$\n]+?)\$/g, stash);         // inline   $...$

  let html = (typeof marked !== 'undefined')
    ? marked.parse(s, { breaks:false, mangle:false, headerIds:false })
    : s.replace(/\n\n/g, '<br><br>');

  return html.replace(/@@M(\d+)@@/g, (_, i) => vault[+i]);
}

function typeset(el){
  if(typeof renderMathInElement !== 'function') return;
  renderMathInElement(el, {
    delimiters: [
      {left:'$$',  right:'$$',  display:true },
      {left:'\\[', right:'\\]', display:true },
      {left:'\\(', right:'\\)', display:false},
      {left:'$',   right:'$',   display:false}
    ],
    throwOnError: false,
    strict: false
  });
}

function fill(el, markdown){
  el.innerHTML = mdMath(markdown);
  typeset(el);
}

/* ============================================================
   Progress helpers
   ============================================================ */
function chapterProgress(ch){
  const total = (ch.problems || []).length;
  if(!total) return { done:0, total:0, pct:0 };
  const done = ch.problems.filter(p => state.solved[p.id]).length;
  return { done, total, pct: Math.round(100 * done / total) };
}

/* ============================================================
   Sidebar
   ============================================================ */
function renderNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = '';

  if(REFERENCE){
    nav.insertAdjacentHTML('beforeend', '<h2>Reference</h2>');
    const r = document.createElement('button');
    r.className = (state.view === 'reference' ? 'active' : '');
    r.innerHTML = 'Formula sheet<span class="ch-meta">Transforms, impedances, algebra</span>';
    r.onclick = () => { state.view = 'reference'; render(); window.scrollTo(0,0); };
    nav.appendChild(r);
  }

  nav.insertAdjacentHTML('beforeend', '<h2 style="margin-top:16px">Chapters</h2>');
  CHAPTERS.forEach((ch, i) => {
    const p = chapterProgress(ch);
    const b = document.createElement('button');
    b.className = (state.view === 'chapter' && i === state.chapter ? 'active' : '');
    b.innerHTML =
      'Chapter ' + ch.id +
      '<span class="ch-meta">' + ch.title +
      (p.total ? ' · ' + p.done + '/' + p.total : '') + '</span>';
    b.onclick = () => { state.view = 'chapter'; state.chapter = i; state.tab = 'guide'; render(); window.scrollTo(0,0); };
    nav.appendChild(b);

    const bar = document.createElement('div');
    bar.className = 'prog';
    bar.innerHTML = '<span style="width:' + p.pct + '%"></span>';
    nav.appendChild(bar);
  });
}

/* ============================================================
   Tabs
   ============================================================ */
function renderTabs(main, ch){
  const wrap = document.createElement('div');
  wrap.className = 'tabs';
  [['guide','Study guide'],['formulas','Formula sheet'],['problems','Problems']].forEach(([key,label]) => {
    const b = document.createElement('button');
    b.textContent = label;
    if(key === 'problems' && ch.problems) b.textContent += ' (' + ch.problems.length + ')';
    b.className = (state.tab === key ? 'active' : '');
    b.onclick = () => { state.tab = key; render(); };
    wrap.appendChild(b);
  });
  main.appendChild(wrap);
}

/* ============================================================
   Study guide tab
   ============================================================ */
function renderGuide(main, ch){
  const secs = ch.guide || [];
  if(!secs.length){
    main.insertAdjacentHTML('beforeend', '<p class="empty">No study guide loaded for this chapter yet.</p>');
    return;
  }
  secs.forEach((sec, i) => {
    const d = document.createElement('details');
    d.className = 'guide-sec';
    if(i === 0) d.open = true;
    const s = document.createElement('summary');
    s.textContent = sec.title;
    d.appendChild(s);
    const body = document.createElement('div');
    body.className = 'guide-body';
    d.appendChild(body);
    main.appendChild(d);
    fill(body, sec.body);
  });
}

/* ============================================================
   Formula sheet tab
   ============================================================ */
function renderFormulas(main, ch){
  const items = ch.formulas || [];
  if(!items.length){
    main.insertAdjacentHTML('beforeend', '<p class="empty">No formula sheet for this chapter yet.</p>');
    return;
  }
  const list = document.createElement('div');
  list.className = 'formula-list';
  main.appendChild(list);
  items.forEach(f => {
    const row = document.createElement('div');
    row.className = 'formula-row';
    const eq = document.createElement('div');
    eq.className = 'formula-eq';
    row.appendChild(eq);
    const n = document.createElement('div');
    n.className = 'note';
    n.textContent = f.note || '';
    row.appendChild(n);
    list.appendChild(row);
    fill(eq, '$' + f.latex + '$');
  });
  main.insertAdjacentHTML('beforeend',
    '<p class="empty" style="padding:14px 0 0">Full transform tables, theorems and ' +
    'algebra refreshers are under <b>Reference &rarr; Formula sheet</b> in the sidebar.</p>');
}

/* ============================================================
   Problems tab
   ============================================================ */
function matches(p, q){
  if(!q) return true;
  const hay = [p.id, p.topic, p.prompt, p.answer, p.expert || '', p.solution].join(' ').toLowerCase();
  return hay.indexOf(q.toLowerCase()) !== -1;
}

function renderProblems(main, ch){
  const all = ch.problems || [];
  if(!all.length){
    main.insertAdjacentHTML('beforeend', '<p class="empty">No problem set for this chapter yet.</p>');
    return;
  }

  const topics = ['all', ...Array.from(new Set(all.map(p => p.topic).filter(Boolean))).sort()];
  const bar = document.createElement('div');
  bar.className = 'filters';
  bar.innerHTML =
    '<label>Difficulty <select id="f-diff">' +
      ['all','warmup','core','challenge'].map(d =>
        '<option value="' + d + '"' + (state.diff === d ? ' selected' : '') + '>' + d + '</option>').join('') +
    '</select></label>' +
    '<label>Topic <select id="f-topic">' +
      topics.map(t =>
        '<option value="' + t + '"' + (state.topic === t ? ' selected' : '') + '>' + t + '</option>').join('') +
    '</select></label>' +
    '<div class="pbar"><span id="pbar-fill"></span></div>' +
    '<div class="pcount" id="pbar-count"></div>' +
    '<button class="act" id="reset-ch">Reset chapter</button>';
  main.appendChild(bar);

  const list = document.createElement('div');
  main.appendChild(list);

  const shown = all.filter(p =>
    (state.diff === 'all'  || p.difficulty === state.diff) &&
    (state.topic === 'all' || p.topic === state.topic) &&
    matches(p, state.query));

  const prog = chapterProgress(ch);
  document.getElementById('pbar-fill').style.width = prog.pct + '%';
  document.getElementById('pbar-count').textContent = prog.done + ' / ' + prog.total + ' solved';

  document.getElementById('f-diff').onchange  = e => { state.diff  = e.target.value; render(); };
  document.getElementById('f-topic').onchange = e => { state.topic = e.target.value; render(); };
  document.getElementById('reset-ch').onclick = () => {
    all.forEach(p => { delete state.solved[p.id]; });
    saveProgress(); render();
  };

  if(!shown.length){
    list.innerHTML = '<p class="empty">No problems match those filters.</p>';
    return;
  }

  shown.forEach(p => {
    const card = document.createElement('div');
    card.className = 'prob' + (state.solved[p.id] ? ' done' : '');

    const head = document.createElement('div');
    head.className = 'prob-head';
    head.innerHTML =
      '<span class="prob-num">' + p.id + '</span>' +
      (p.difficulty ? '<span class="tag ' + p.difficulty + '">' + p.difficulty + '</span>' : '') +
      (p.topic ? '<span class="tag">' + p.topic + '</span>' : '');
    card.appendChild(head);

    const body = document.createElement('div');
    body.className = 'prob-body';
    card.appendChild(body);

    const prompt = document.createElement('div');
    body.appendChild(prompt);

    const acts = document.createElement('div');
    acts.className = 'prob-actions';
    body.appendChild(acts);

    const ansBox = document.createElement('div');
    ansBox.className = 'reveal hidden';
    ansBox.innerHTML = '<h4>Answer</h4><div class="ans-body"></div>';
    body.appendChild(ansBox);

    const expBox = document.createElement('div');
    expBox.className = 'reveal expert hidden';
    expBox.innerHTML = '<h4>How an expert sees it</h4><div class="exp-body"></div>';
    body.appendChild(expBox);

    const solBox = document.createElement('div');
    solBox.className = 'reveal hidden';
    solBox.innerHTML = '<h4>Full solution</h4><div class="sol-body"></div>';
    body.appendChild(solBox);

    if(p.hint){
      const hintBtn = document.createElement('button');
      hintBtn.className = 'act';
      hintBtn.textContent = 'Hint';
      const hintBox = document.createElement('div');
      hintBox.className = 'reveal hidden';
      hintBox.innerHTML = '<h4>Hint</h4><div class="hint-body"></div>';
      body.insertBefore(hintBox, ansBox);
      hintBtn.onclick = () => {
        hintBox.classList.toggle('hidden');
        if(!hintBox.dataset.rendered){
          fill(hintBox.querySelector('.hint-body'), p.hint);
          hintBox.dataset.rendered = '1';
        }
      };
      acts.appendChild(hintBtn);
    }

    const ansBtn = document.createElement('button');
    ansBtn.className = 'act';
    ansBtn.textContent = 'Show answer';
    ansBtn.onclick = () => {
      ansBox.classList.toggle('hidden');
      ansBtn.textContent = ansBox.classList.contains('hidden') ? 'Show answer' : 'Hide answer';
      if(!ansBox.dataset.rendered){
        fill(ansBox.querySelector('.ans-body'), p.answer);
        ansBox.dataset.rendered = '1';
      }
    };
    acts.appendChild(ansBtn);

    if(p.expert){
      const expBtn = document.createElement('button');
      expBtn.className = 'act expert';
      expBtn.textContent = 'How an expert sees it';
      expBtn.onclick = () => {
        expBox.classList.toggle('hidden');
        expBtn.textContent = expBox.classList.contains('hidden')
          ? 'How an expert sees it' : 'Hide expert view';
        if(!expBox.dataset.rendered){
          fill(expBox.querySelector('.exp-body'), p.expert);
          expBox.dataset.rendered = '1';
        }
      };
      acts.appendChild(expBtn);
    }

    const solBtn = document.createElement('button');
    solBtn.className = 'act';
    solBtn.textContent = 'Show full solution';
    solBtn.onclick = () => {
      solBox.classList.toggle('hidden');
      solBtn.textContent = solBox.classList.contains('hidden') ? 'Show full solution' : 'Hide full solution';
      if(!solBox.dataset.rendered){
        fill(solBox.querySelector('.sol-body'), p.solution);
        solBox.dataset.rendered = '1';
      }
    };
    acts.appendChild(solBtn);

    const doneBtn = document.createElement('button');
    doneBtn.className = 'act' + (state.solved[p.id] ? ' done' : '');
    doneBtn.textContent = state.solved[p.id] ? '\u2713 Solved' : 'Mark as solved';
    doneBtn.onclick = () => {
      if(state.solved[p.id]) delete state.solved[p.id];
      else state.solved[p.id] = true;
      saveProgress(); render();
    };
    acts.appendChild(doneBtn);

    list.appendChild(card);
    fill(prompt, p.prompt);
  });
}

/* ============================================================
   Reference view
   ============================================================ */
function renderReference(main){
  const h = document.createElement('h2');
  h.className = 'chap';
  h.textContent = REFERENCE.title || 'Reference';
  main.appendChild(h);
  if(REFERENCE.subtitle){
    const sub = document.createElement('div');
    sub.className = 'chap-sub';
    sub.textContent = REFERENCE.subtitle;
    main.appendChild(sub);
  }
  (REFERENCE.sections || []).forEach((sec, i) => {
    const d = document.createElement('details');
    d.className = 'guide-sec';
    if(i === 0) d.open = true;
    const s = document.createElement('summary');
    s.textContent = sec.title;
    d.appendChild(s);
    const body = document.createElement('div');
    body.className = 'guide-body';
    d.appendChild(body);
    main.appendChild(d);
    fill(body, sec.body);
  });
}

/* ============================================================
   Master render
   ============================================================ */
function render(){
  renderNav();
  const main = document.getElementById('main');
  main.innerHTML = '';

  if(state.view === 'reference' && REFERENCE){
    renderReference(main);
    return;
  }

  if(!CHAPTERS.length){
    main.innerHTML = '<p class="empty">No chapters loaded. Add a file in <code>chapters/</code> ' +
                     'and a matching <code>&lt;script&gt;</code> tag in index.html.</p>';
    return;
  }

  const ch = CHAPTERS[state.chapter];
  const h = document.createElement('h2');
  h.className = 'chap';
  h.textContent = 'Chapter ' + ch.id + ' — ' + ch.title;
  main.appendChild(h);

  if(ch.sections){
    const sub = document.createElement('div');
    sub.className = 'chap-sub';
    sub.textContent = 'Sections covered: ' + ch.sections;
    main.appendChild(sub);
  }

  renderTabs(main, ch);

  if(state.tab === 'guide')         renderGuide(main, ch);
  else if(state.tab === 'formulas') renderFormulas(main, ch);
  else                              renderProblems(main, ch);
}

document.getElementById('search').addEventListener('input', e => {
  state.query = e.target.value;
  if(state.query){ state.view = 'chapter'; state.tab = 'problems'; }
  render();
});

loadProgress();
window.addEventListener('DOMContentLoaded', render);
if(document.readyState !== 'loading') render();
</script>
</body>
</html>
