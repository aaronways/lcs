<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexus · Linear Control Systems</title>
<meta name="description" content="Nexus is a control-systems companion: guides, formula sheets, and original problems built for understanding, not pattern matching.">
<meta name="theme-color" content="#0A0A0A">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="favicon.png" type="image/png">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400;1,8..60,600&display=swap" rel="stylesheet">

<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>

<style>
:root{
  --ink:#111111; --muted:#5C5C5C; --paper:#F3F3F0; --panel:#FFFFFF; --panel-2:#EBEBE6;
  --line:#DCDCD4; --accent:#111111; --ok:#1F6B45; --ok-soft:#E3F0E8; --warn:#8E3510;
  --warn-soft:#F6E4DA; --expert:#6B4E12; --expert-soft:#F4EDDA; --header:#0A0A0A;
  --header-text:#F5F5F2; --accent-soft:#ECECEA; --radius:14px;
  --sans:"Outfit",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
}
html.dark{
  --ink:#F0EDE6; --muted:#A39E94; --paper:#101010; --panel:#171717; --panel-2:#202020;
  --line:#2C2C2C; --accent:#F0EDE6; --ok:#7DC9A0; --ok-soft:#163024; --warn:#E0A07A;
  --warn-soft:#3A2418; --expert:#E0C47A; --expert-soft:#2A2414; --header:#000;
  --header-text:#F0EDE6; --accent-soft:#1C1C1C;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--sans);color:var(--ink);background:var(--paper);line-height:1.55;font-size:16.5px}
a{color:var(--ink)}
button,input,select{font:inherit}
header.app{background:var(--header);color:var(--header-text);padding:10px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:12px;min-width:0;cursor:pointer;background:none;border:0;color:inherit;padding:0}
.brand img{width:22px;height:25px;display:block}
.brand .name{font-size:15px;font-weight:650;letter-spacing:.18em;text-transform:uppercase}
.brand .sub{font-size:12.5px;opacity:.55;margin-left:2px}
.header-tools{margin-left:auto;display:flex;align-items:center;gap:8px}
#search{padding:8px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.07);color:var(--header-text);font-size:13.5px;width:240px}
#search::placeholder{color:rgba(255,255,255,.5)}
#search:focus{outline:2px solid rgba(255,255,255,.35);outline-offset:1px}
.icon-btn{width:36px;height:36px;border-radius:999px;border:1px solid rgba(255,255,255,.16);background:transparent;color:var(--header-text);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.icon-btn:hover{background:rgba(255,255,255,.08)}
.menu-btn{display:none}
.layout{display:flex;align-items:flex-start;max-width:1440px;margin:0 auto}
nav.side{width:258px;flex:0 0 258px;border-right:1px solid var(--line);padding:18px 0 48px;position:sticky;top:57px;max-height:calc(100vh - 57px);overflow-y:auto;background:var(--paper)}
nav.side h2{font-size:10px;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted);margin:18px 0 6px 18px;font-weight:650}
nav.side h2:first-child{margin-top:4px}
nav.side button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 16px 8px 18px;cursor:pointer;color:var(--ink);border-left:2px solid transparent}
nav.side button:hover{background:var(--panel-2)}
nav.side button.active{background:var(--panel);border-left-color:var(--ink);font-weight:650}
nav.side button .ch-meta{display:block;font-size:12px;color:var(--muted);font-weight:450;margin-top:1px}
nav .prog{height:2px;background:var(--line);margin:3px 18px 2px;border-radius:99px;overflow:hidden}
nav .prog span{display:block;height:100%;background:var(--ink);width:0}
html.dark nav .prog span{background:var(--ok)}
main{flex:1;padding:30px 42px 96px;min-width:0}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 0 22px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 16px;cursor:pointer;font-size:14.5px;color:var(--muted)}
.tabs button.active{color:var(--ink);border-bottom-color:var(--ink);font-weight:650}
h2.chap{margin:0 0 6px;font-size:30px;line-height:1.15;font-family:var(--serif);font-weight:650;letter-spacing:-.03em}
.chap-sub{color:var(--muted);font-size:14px;margin-bottom:10px}
.brief{font-family:var(--serif);font-size:17.5px;line-height:1.5;max-width:42rem;margin:0 0 22px}
.guide-sec{border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;background:var(--panel)}
.guide-sec>summary{cursor:pointer;padding:13px 16px;font-weight:600;font-size:15.5px;list-style:none;display:flex;align-items:center;gap:8px}
.guide-sec>summary::-webkit-details-marker{display:none}
.guide-sec>summary .chev{color:var(--muted);font-size:11px;width:14px;flex:0 0 14px;transform:rotate(-90deg);transition:transform .15s ease}
.guide-sec[open]>summary .chev{transform:rotate(0)}
.guide-sec>summary .sum-text .katex{font-size:1em}
.guide-body{padding:2px 20px 18px;font-family:var(--serif);font-size:17.5px}
.guide-body h3{font-family:var(--sans);font-size:15px;margin:18px 0 6px;font-weight:650}
.guide-body h4{font-family:var(--sans);font-size:14px;margin:16px 0 5px;font-weight:650}
.guide-body table{border-collapse:collapse;margin:12px 0;font-size:15px;font-family:var(--sans);width:100%}
.guide-body th,.guide-body td{border:1px solid var(--line);padding:7px 11px;text-align:left;vertical-align:top}
.guide-body th{background:var(--panel-2);font-weight:650}
.guide-body code{background:var(--panel-2);padding:1px 6px;border-radius:5px;font-size:13.5px;font-family:ui-monospace,Menlo,monospace}
.guide-body blockquote{border-left:2px solid var(--ink);background:var(--accent-soft);margin:14px 0;padding:10px 16px;border-radius:0 10px 10px 0;font-family:var(--sans);font-size:15.5px}
.guide-body p{margin:10px 0}
.guide-body svg{max-width:100%;height:auto}
.formula-grid{display:grid;gap:10px}
.formula-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px 14px}
.formula-eq{overflow-x:auto;padding:4px 0 2px}
.formula-note{margin-top:6px;color:var(--muted);font-size:14.5px;font-family:var(--sans);line-height:1.45}
.formula-note p{margin:0}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px;font-size:13.5px}
.filters select{padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--ink)}
.pbar{flex:1;min-width:120px;height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.pbar span{display:block;height:100%;background:var(--ink)}
html.dark .pbar span{background:var(--ok)}
.pcount{color:var(--muted);font-size:13px;white-space:nowrap}
.prob{border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px;overflow:hidden;background:var(--panel)}
.prob.done{box-shadow:inset 3px 0 0 var(--ok)}
.prob-head{display:flex;gap:8px;align-items:baseline;padding:11px 16px;background:var(--panel-2);flex-wrap:wrap}
.prob-num{font-weight:700;font-size:14px;letter-spacing:.04em}
.tag{font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;padding:2px 8px;border-radius:999px;background:var(--panel);color:var(--muted);font-weight:650}
.tag.warmup{background:var(--ok-soft);color:var(--ok)}
.tag.core{background:var(--accent-soft);color:var(--ink)}
.tag.challenge{background:var(--warn-soft);color:var(--warn)}
.prob-body{padding:14px 18px 16px}
.prob-body,.reveal{font-family:var(--serif);font-size:17px}
.prob-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;font-family:var(--sans)}
button.act{font-size:13px;padding:6px 13px;border-radius:9px;border:1px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
button.act:hover{background:var(--ink);color:var(--paper)}
button.act.done{border-color:var(--ok);color:var(--ok)}
button.act.done:hover{background:var(--ok);color:#fff}
button.act.expert{border-color:var(--expert);color:var(--expert)}
button.act.expert:hover{background:var(--expert);color:#fff}
.reveal{margin-top:12px;padding:12px 16px;border-radius:10px;background:var(--accent-soft);border-left:2px solid var(--ink);font-size:16.5px}
.reveal.expert{background:var(--expert-soft);border-left-color:var(--expert)}
.reveal.expert h4{color:var(--expert)}
.reveal h4{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.9px;font-family:var(--sans);font-weight:700}
.hidden{display:none}
.empty{color:var(--muted);padding:28px 0;font-size:14.5px;font-family:var(--sans)}
.katex{font-size:1.04em}
.katex-display{overflow-x:auto;overflow-y:hidden;padding:4px 0}
.home-hero{margin-bottom:28px;max-width:42rem}
.home-kicker{display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.home-kicker img{width:16px;height:18px}
html.dark .home-kicker img{filter:invert(1)}
.home-hero h2{font-family:var(--serif);font-size:34px;letter-spacing:-.03em;margin:0 0 10px;font-weight:650}
.home-hero p{font-family:var(--serif);font-size:18.5px;margin:0}
.path{display:grid;gap:8px}
.path-row{display:grid;grid-template-columns:88px 1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.path-row.openable{cursor:pointer}
.path-row.openable:hover{background:var(--panel-2)}
.path-row .wk{font-size:11px;font-weight:650;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.path-row .what{font-weight:600}
.path-row .what small{display:block;font-weight:450;color:var(--muted);font-size:13px;margin-top:2px}
.path-row .go{font-size:13px;color:var(--muted);font-weight:550}
.backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:25}
@media(max-width:860px){
  .menu-btn{display:inline-flex}
  .brand .sub{display:none}
  .layout{flex-direction:column}
  nav.side{position:fixed;left:0;top:0;bottom:0;z-index:30;max-height:100vh;transform:translateX(-105%);transition:transform .2s ease;width:min(320px,86vw);flex:none;padding-top:64px;background:var(--paper)}
  nav.side.open{transform:none}
  .backdrop.show{display:block}
  main{padding:18px 16px 72px}
  #search{width:min(48vw,190px)}
  h2.chap{font-size:24px}
  .home-hero h2{font-size:28px}
}

.sec-nav{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 18px}
.sec-chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer}
.sec-chip:hover{background:var(--panel-2)}
.sec-chip.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}
html.dark .sec-chip.active{background:var(--ink);color:#111}
.sec-head{display:flex;align-items:baseline;gap:10px;margin:22px 0 10px}
.sec-head:first-child{margin-top:4px}
.sec-id{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:650}
.sec-title{font-size:15px;font-weight:650}
.nx-fig{max-width:100%;height:auto;display:block;margin:0 auto;color:var(--ink)}
.nx-fig text{fill:currentColor;font-family:var(--sans);font-size:14px}
.nx-frame{margin:18px 0 8px;padding:20px 12px 8px;background:var(--panel-2);border:1px solid var(--line);border-radius:12px}
.nx-frame figcaption{font-family:var(--sans);font-size:13px;color:var(--muted);text-align:center;margin:8px 0 10px;line-height:1.4}
.guide-body>p,.guide-body>ul,.guide-body>ol,.guide-body>blockquote,.guide-body>table,.guide-body>h3,.guide-body>h4{max-width:40rem}
.guide-body{font-size:17.5px;line-height:1.62}
.example-row{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 8px;font-family:var(--sans)}
.example-hold{margin:8px 0 4px}
.example-hold .prob{margin:0}

.sec-head{padding-top:6px;border-top:1px solid var(--line)}
.sec-head:first-of-type{border-top:0;padding-top:0}
.tag.sec{background:var(--panel);color:var(--ink);letter-spacing:.08em}

@media print{
  nav.side,header.app,.tabs,.filters,.prob-actions,.icon-btn,.menu-btn{display:none!important}
  .hidden{display:block!important}
  main{padding:0}
}
</style>
</head>
<body>
<div class="backdrop" id="backdrop"></div>
<header class="app">
  <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open navigation">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <button class="brand" id="brand-btn" type="button" aria-label="Nexus home">
    <img src="logo-header-white.png" alt="">
    <span class="name">Nexus</span>
    <span class="sub">Control systems</span>
  </button>
  <div class="header-tools">
    <input id="search" type="search" placeholder="Search this chapter" aria-label="Search">
    <button class="icon-btn" id="theme-btn" aria-label="Toggle theme" title="Theme">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M5 12H3M21 12h-2M6.3 6.3l1.4 1.4M16.3 16.3l1.4 1.4M6.3 17.7l1.4-1.4M16.3 7.7l1.4-1.4"/></svg>
    </button>
  </div>
</header>
<div class="layout">
  <nav class="side" id="nav"></nav>
  <main id="main"></main>
</div>
<script>
const CHAPTERS = [];
let REFERENCE = null;
function registerChapter(ch){ CHAPTERS.push(ch); }
function registerReference(ref){ REFERENCE = ref; }
</script>
<script src="reference.js"></script>
<script src="chapters/ch01.js"></script>
<script src="chapters/ch02.js"></script>
<script src="chapters/ch04.js"></script>
<script src="chapters/ch05.js"></script>
<script src="app.js"></script>
</body>
</html>
