<style>
:root{
  --ink:#1C1915;
  --muted:#6A645C;
  --paper:#F7F4EE;
  --panel:#FFFcf7;
  --panel-2:#F1EBE1;
  --line:#E2DBD0;
  --accent:#173A56;
  --accent-2:#2B6B8A;
  --accent-soft:#E7EEF3;
  --ok:#2A6B49;
  --ok-soft:#E4F0E8;
  --warn:#9A3B12;
  --warn-soft:#F6E6DC;
  --expert:#7A5A16;
  --expert-soft:#F6EFD9;
  --header:#173A56;
  --header-text:#F4EFE6;
  --shadow:0 1px 2px rgba(28,25,21,.05), 0 8px 24px rgba(28,25,21,.06);
  --radius:12px;
  --sans:"Source Sans 3",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
}
html.dark{
  --ink:#EDE7DC;
  --muted:#A8A093;
  --paper:#12151A;
  --panel:#1A1F27;
  --panel-2:#222833;
  --line:#2C3340;
  --accent:#8EBFDA;
  --accent-2:#A9D0E4;
  --accent-soft:#1C2A36;
  --ok:#7FCB9F;
  --ok-soft:#163024;
  --warn:#E0A07A;
  --warn-soft:#3A2418;
  --expert:#E0C47A;
  --expert-soft:#2E2818;
  --header:#0E151C;
  --header-text:#EDE7DC;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 28px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:var(--sans);
  color:var(--ink);
  background:var(--paper);
  line-height:1.58;
  font-size:16.5px;
}
a{color:var(--accent-2)}
button,input,select{font:inherit}

header.app{
  background:var(--header);
  color:var(--header-text);
  padding:12px 20px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  position:sticky;top:0;z-index:20;
  border-bottom:1px solid rgba(255,255,255,.08);
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:28px;height:28px;flex:0 0 28px;border-radius:7px}
.brand h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.15px;white-space:nowrap}
.brand .sub{font-size:12.5px;opacity:.72;margin-top:1px}
.header-tools{margin-left:auto;display:flex;align-items:center;gap:8px}
#search{
  padding:8px 12px;border-radius:999px;
  border:1px solid rgba(255,255,255,.22);
  background:rgba(255,255,255,.1);color:var(--header-text);

}
#search::placeholder{color:rgba(255,255,255,.62)}
#search:focus{outline:2px solid rgba(244,197,109,.7);outline-offset:1px;background:rgba(255,255,255,.16)}
.icon-btn{
  width:36px;height:36px;border-radius:999px;border:1px solid rgba(255,255,255,.22);
  background:transparent;color:var(--header-text);cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;
}
.icon-btn:hover{background:rgba(255,255,255,.1)}
.menu-btn{display:none}

.layout{display:flex;align-items:flex-start;max-width:1440px;margin:0 auto}

  font-size:10.5px;text-transform:uppercase;letter-spacing:1.2px;

}
nav.side h2:first-child{margin-top:2px}
nav.side button{
  display:block;width:100%;text-align:left;background:none;border:0;
  padding:8px 16px 8px 18px;cursor:pointer;color:var(--ink);
  border-left:3px solid transparent;border-radius:0;
}
nav.side button:hover{background:var(--panel-2)}
nav.side button.active{
  background:var(--accent-soft);

  font-weight:650;color:var(--accent);
}
nav.side button .ch-meta{display:block;font-size:12px;color:var(--muted);font-weight:450;margin-top:1px}
nav .prog{height:3px;background:var(--line);margin:3px 18px 2px;border-radius:99px;overflow:hidden}
nav .prog span{display:block;height:100%;background:var(--ok);width:0}

main{flex:1;padding:28px 40px 96px;min-width:0}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 0 22px}

.chap-sub{color:var(--muted);font-size:14px;margin-bottom:18px}

.guide-sec{
  border:1px solid var(--line);border-radius:var(--radius);
  margin-bottom:10px;overflow:hidden;background:var(--panel);
}
.guide-sec>summary{
  cursor:pointer;padding:12px 16px;background:var(--panel);
  font-weight:650;font-size:15.5px;color:var(--accent);

}
.guide-sec>summary::-webkit-details-marker{display:none}
.guide-sec>summary .chev{
  color:var(--muted);font-size:11px;width:14px;flex:0 0 14px;
  transform:rotate(-90deg);transition:transform .15s ease;
}
.guide-sec[open]>summary .chev{transform:rotate(0)}
.guide-sec>summary .sum-text{min-width:0}
.guide-sec>summary .sum-text .katex{font-size:1em}
.guide-body{padding:4px 20px 18px;font-family:var(--serif);font-size:17.5px}
.guide-body h3{font-family:var(--sans);font-size:15.5px;color:var(--accent);margin:18px 0 6px;font-weight:700}
.guide-body h4{font-family:var(--sans);font-size:14.5px;margin:16px 0 5px;font-weight:650}
.guide-body table{border-collapse:collapse;margin:12px 0;font-size:15px;font-family:var(--sans);width:100%}
.guide-body th,.guide-body td{border:1px solid var(--line);padding:7px 11px;text-align:left;vertical-align:top}
.guide-body th{background:var(--panel-2);font-weight:650}
.guide-body code{background:var(--panel-2);padding:1px 6px;border-radius:5px;font-size:13.5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.guide-body blockquote{
  border-left:3px solid var(--accent);background:var(--accent-soft);
  margin:14px 0;padding:10px 16px;border-radius:0 10px 10px 0;
  font-family:var(--sans);font-size:15.5px;
}
.guide-body p{margin:10px 0}
.guide-body svg{max-width:100%;height:auto}

.formula-list{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--panel)}
.formula-row{display:flex;align-items:center;gap:16px;padding:12px 16px;border-bottom:1px solid var(--line)}
.formula-row:last-child{border-bottom:0}
.formula-row:nth-child(even){background:var(--panel-2)}
.formula-eq{flex:0 0 auto;min-width:200px}
.formula-row .note{font-size:13px;color:var(--muted);text-align:right;margin-left:auto;max-width:46%}
@media(max-width:700px){
  .formula-row{flex-direction:column;align-items:flex-start;gap:6px}
  .formula-row .note{text-align:left;margin-left:0;max-width:100%}
}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px;font-size:13.5px}
.filters select{
  padding:7px 10px;border:1px solid var(--line);border-radius:9px;
  background:var(--panel);color:var(--ink);
}
.pbar{flex:1;min-width:120px;height:7px;background:var(--line);border-radius:99px;overflow:hidden}
.pbar span{display:block;height:100%;background:var(--ok)}
.pcount{color:var(--muted);font-size:13px;white-space:nowrap}

.prob{
  border:1px solid var(--line);border-radius:var(--radius);
  margin-bottom:14px;overflow:hidden;background:var(--panel);
}
.prob.done{border-color:color-mix(in srgb, var(--ok) 55%, var(--line));box-shadow:inset 3px 0 0 var(--ok)}
.prob-head{display:flex;gap:8px;align-items:baseline;padding:11px 16px;background:var(--panel-2);flex-wrap:wrap}
.prob-num{font-weight:750;color:var(--accent);font-size:14px;letter-spacing:.02em}
.tag{
  font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;
  padding:2px 8px;border-radius:999px;border:1px solid var(--line);
  background:var(--panel);color:var(--muted);font-weight:650;
}
.tag.warmup{border-color:transparent;background:var(--ok-soft);color:var(--ok)}
.tag.core{border-color:transparent;background:var(--accent-soft);color:var(--accent)}
.tag.challenge{border-color:transparent;background:var(--warn-soft);color:var(--warn)}
.prob-body{padding:14px 18px 16px}
.prob-body, .reveal{font-family:var(--serif);font-size:17px}
.prob-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;font-family:var(--sans)}
button.act{
  font-size:13px;padding:6px 13px;border-radius:9px;
  border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer;
}
button.act:hover{background:var(--accent);color:#fff}
html.dark button.act:hover{color:#12151A}
button.act.done{border-color:var(--ok);color:var(--ok)}
button.act.done:hover{background:var(--ok);color:#fff}
button.act.expert{border-color:var(--expert);color:var(--expert)}
button.act.expert:hover{background:var(--expert);color:#fff}
.reveal{
  margin-top:12px;padding:12px 16px;border-radius:10px;
  background:var(--accent-soft);border-left:3px solid var(--accent);
  font-size:16.5px;
}
.reveal.expert{background:var(--expert-soft);border-left-color:var(--expert)}
.reveal.expert h4{color:var(--expert)}
.reveal h4{
  margin:0 0 8px;font-size:11.5px;text-transform:uppercase;letter-spacing:.8px;
  color:var(--accent);font-family:var(--sans);font-weight:700;
}
.hidden{display:none}

.empty{color:var(--muted);padding:28px 0;font-size:14.5px;font-family:var(--sans)}
.katex{font-size:1.04em}
.katex-display{overflow-x:auto;overflow-y:hidden;padding:4px 0}

.home-hero{
  background:var(--panel);border:1px solid var(--line);border-radius:16px;
  padding:28px 30px 24px;margin-bottom:22px;box-shadow:var(--shadow);
}
.home-hero p.lead{font-family:var(--serif);font-size:19px;margin:8px 0 0;max-width:46rem}
.path{display:grid;gap:8px}
.path-row{
  display:grid;grid-template-columns:92px 1fr auto;gap:12px;align-items:center;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:11px 14px;cursor:pointer;
}
.path-row:hover{border-color:var(--accent);background:var(--accent-soft)}
.path-row .wk{font-size:11.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.path-row .what{font-weight:600}
.path-row .what small{display:block;font-weight:450;color:var(--muted);font-size:13px;margin-top:2px}
.path-row .go{font-size:13px;color:var(--accent-2);font-weight:650}

.backdrop{display:none;position:fixed;inset:0;background:rgba(18,16,12,.4);z-index:25}
@media(max-width:860px){
  .menu-btn{display:inline-flex}
  .layout{flex-direction:column}
  nav.side{
    position:fixed;left:0;top:0;bottom:0;z-index:30;
    max-height:100vh;transform:translateX(-105%);
    transition:transform .2s ease;width:min(320px,86vw);flex:none;
    box-shadow:var(--shadow);padding-top:70px;
  }
  nav.side.open{transform:none}
  .backdrop.show{display:block}
  main{padding:18px 16px 72px}
  #search{width:min(52vw,200px)}
  .brand .sub{display:none}
  h2.chap{font-size:24px}
}
@media print{
  nav.side,header.app,.tabs,.filters,.prob-actions,.icon-btn,.menu-btn{display:none!important}
  .hidden{display:block!important}
  main{padding:0}
  body{background:#fff;color:#000}
  .guide-sec{break-inside:avoid}
}
</style>

<div class="backdrop" id="backdrop"></div>

<header class="app">
  <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open chapter list">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <div class="brand">
    <img class="mark" src="favicon.svg" alt="">
    <div>
      <h1>Linear Control Systems</h1>
      <div class="sub">Guides, formulas, and worked problems · Nise 7e</div>
    </div>
  </div>
  <div class="header-tools">
    <input id="search" type="search" placeholder="Search this chapter…" aria-label="Search">

      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M5 12H3M21 12h-2M6.3 6.3l1.4 1.4M16.3 16.3l1.4 1.4M6.3 17.7l1.4-1.4M16.3 7.7l1.4-1.4"/></svg>
    </button>
  </div>
</header>

<div class="layout">
  <nav class="side" id="nav"></nav>
  <main id="main"></main>
</div>

<script>
const CHAPTERS = [];
let REFERENCE = null;
function registerChapter(ch){ CHAPTERS.push(ch); }
function registerReference(ref){ REFERENCE = ref; }
</script>

<script src="reference.js"></script>
<script src="chapters/ch01.js"></script>
<script src="chapters/ch02.js"></script>
<script src="chapters/ch04.js"></script>

<script>
const STORE_KEY = 'lcs-companion:v1';
const THEME_KEY = 'lcs-companion:theme';

let state = {
  view: 'home',
  chapter: 0,
  tab: 'guide',
  solved: {},
  query: '',
  diff: 'all',
  topic: 'all'
};

function loadProgress(){
  try { state.solved = JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }
  catch(e){ state.solved = {}; }
}
function saveProgress(){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state.solved)); } catch(e){}
}

function applyTheme(theme){
  document.documentElement.classList.toggle('dark', theme === 'dark');
  try { localStorage.setItem(THEME_KEY, theme); } catch(e){}
}
(function initTheme(){
  let theme = 'light';
  try { theme = localStorage.getItem(THEME_KEY) || theme; } catch(e){}
  if(!localStorage.getItem(THEME_KEY) && matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
  applyTheme(theme);
})();

function mdMath(src){
  if(!src) return '';
  const vault = [];
  const stash = m => { vault.push(m); return '@@M' + (vault.length - 1) + '@@'; };
  let s = String(src)
    .replace(/\$\$([\s\S]*?)\$\$/g, stash)
    .replace(/\\\[([\s\S]*?)\\\]/g, stash)
    .replace(/\\\(([\s\S]*?)\\\)/g, stash)
    .replace(/\$([^$\n]+?)\$/g, stash);
  let html = (typeof marked !== 'undefined')
    ? marked.parse(s, { breaks:false, mangle:false, headerIds:false })
    : s.replace(/\n\n/g, '<br><br>');
  return html.replace(/@@M(\d+)@@/g, (_, i) => vault[+i]);
}

function mdInline(src){
  return mdMath(src).replace(/^<p>/,'').replace(/<\/p>\s*$/,'').trim();
}

function typeset(el){
  if(typeof renderMathInElement !== 'function') return;
  renderMathInElement(el, {
    delimiters: [
      {left:'$$',  right:'$$',  display:true },
      {left:'\\[', right:'\\]', display:true },
      {left:'\\(', right:'\\)', display:false},
      {left:'$',   right:'$',   display:false}
    ],
    throwOnError: false,
    strict: false
  });
}

function fill(el, markdown){
  el.innerHTML = mdMath(markdown);
  typeset(el);
}
function fillInline(el, markdown){
  el.innerHTML = mdInline(markdown);
  typeset(el);
}

function chapterProgress(ch){
  const total = (ch.problems || []).length;
  if(!total) return { done:0, total:0, pct:0 };
  const done = ch.problems.filter(p => state.solved[p.id]).length;
  return { done, total, pct: Math.round(100 * done / total) };
}

function closeNav(){
  document.getElementById('nav').classList.remove('open');
  document.getElementById('backdrop').classList.remove('show');
}

function renderNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = '';

  nav.insertAdjacentHTML('beforeend', '<h2>Start</h2>');
  const home = document.createElement('button');
  home.className = state.view === 'home' ? 'active' : '';
  home.innerHTML = 'Course map<span class="ch-meta">What to study, and in what order</span>';
  home.onclick = () => { state.view = 'home'; closeNav(); render(); window.scrollTo(0,0); };
  nav.appendChild(home);

  if(REFERENCE){
    nav.insertAdjacentHTML('beforeend', '<h2>Reference</h2>');
    const r = document.createElement('button');
    r.className = state.view === 'reference' ? 'active' : '';
    r.innerHTML = 'Formula sheet<span class="ch-meta">Transforms, impedances, algebra</span>';
    r.onclick = () => { state.view = 'reference'; closeNav(); render(); window.scrollTo(0,0); };
    nav.appendChild(r);
  }

  nav.insertAdjacentHTML('beforeend', '<h2>Chapters</h2>');
  CHAPTERS.forEach((ch, i) => {
    const p = chapterProgress(ch);
    const b = document.createElement('button');
    b.className = (state.view === 'chapter' && i === state.chapter ? 'active' : '');
    b.innerHTML =
      'Chapter ' + ch.id +
      '<span class="ch-meta">' + ch.title +
      (p.total ? ' · ' + p.done + '/' + p.total : '') + '</span>';
    b.onclick = () => {
      state.view = 'chapter'; state.chapter = i; state.tab = 'guide';
      closeNav(); render(); window.scrollTo(0,0);
    };
    nav.appendChild(b);
    const bar = document.createElement('div');
    bar.className = 'prog';
    bar.innerHTML = '<span style="width:' + p.pct + '%"></span>';
    nav.appendChild(bar);
  });
}

function renderTabs(main, ch){
  const wrap = document.createElement('div');
  wrap.className = 'tabs';
  [['guide','Study guide'],['formulas','Formula sheet'],['problems','Problems']].forEach(([key,label]) => {
    const b = document.createElement('button');
    b.textContent = label;
    if(key === 'problems' && ch.problems) b.textContent += ' (' + ch.problems.length + ')';
    b.className = state.tab === key ? 'active' : '';
    b.onclick = () => { state.tab = key; render(); };
    wrap.appendChild(b);
  });
  main.appendChild(wrap);
}

function renderGuide(main, ch){
  const secs = ch.guide || [];
  if(!secs.length){
    main.insertAdjacentHTML('beforeend', '<p class="empty">No study guide loaded for this chapter yet.</p>');
    return;
  }
  secs.forEach((sec, i) => {
    const d = document.createElement('details');
    d.className = 'guide-sec';
    if(i === 0) d.open = true;
    const s = document.createElement('summary');
    const chev = document.createElement('span');
    chev.className = 'chev';
    chev.textContent = '▾';
    const label = document.createElement('span');
    label.className = 'sum-text';
    s.appendChild(chev);
    s.appendChild(label);
    d.appendChild(s);
    const body = document.createElement('div');
    body.className = 'guide-body';
    d.appendChild(body);
    main.appendChild(d);
    fillInline(label, sec.title);
    fill(body, sec.body);
  });
}

function renderFormulas(main, ch){
  const items = ch.formulas || [];
  if(!items.length){
    main.insertAdjacentHTML('beforeend', '<p class="empty">No formula sheet for this chapter yet.</p>');
    return;
  }
  const list = document.createElement('div');
  list.className = 'formula-list';
  main.appendChild(list);
  items.forEach(f => {
    const row = document.createElement('div');
    row.className = 'formula-row';
    const eq = document.createElement('div');
    eq.className = 'formula-eq';
    row.appendChild(eq);
    const n = document.createElement('div');
    n.className = 'note';
    n.textContent = f.note || '';
    row.appendChild(n);
    list.appendChild(row);
    fill(eq, '$' + f.latex + '$');
  });
  main.insertAdjacentHTML('beforeend',
    '<p class="empty" style="padding:16px 0 0">Full transform tables, theorems and algebra refreshers live under <b>Reference</b> in the sidebar.</p>');
}

function matches(p, q){
  if(!q) return true;
  const hay = [p.id, p.topic, p.prompt, p.answer, p.expert || '', p.solution].join(' ').toLowerCase();
  return hay.indexOf(q.toLowerCase()) !== -1;
}

function renderProblems(main, ch){
  const all = ch.problems || [];
  if(!all.length){
    main.insertAdjacentHTML('beforeend', '<p class="empty">No problem set for this chapter yet.</p>');
    return;
  }

  const topics = ['all', ...Array.from(new Set(all.map(p => p.topic).filter(Boolean))).sort()];
  const bar = document.createElement('div');
  bar.className = 'filters';
  bar.innerHTML =
    '<label>Difficulty <select id="f-diff">' +
      ['all','warmup','core','challenge'].map(d =>
        '<option value="' + d + '"' + (state.diff === d ? ' selected' : '') + '>' + d + '</option>').join('') +
    '</select></label>' +
    '<label>Topic <select id="f-topic">' +
      topics.map(t =>
        '<option value="' + t + '"' + (state.topic === t ? ' selected' : '') + '>' + t + '</option>').join('') +
    '</select></label>' +
    '<div class="pbar"><span id="pbar-fill"></span></div>' +
    '<div class="pcount" id="pbar-count"></div>' +
    '<button class="act" id="reset-ch">Reset chapter</button>';
  main.appendChild(bar);

  const list = document.createElement('div');
  main.appendChild(list);

  const shown = all.filter(p =>
    (state.diff === 'all'  || p.difficulty === state.diff) &&
    (state.topic === 'all' || p.topic === state.topic) &&
    matches(p, state.query));

  const prog = chapterProgress(ch);
  document.getElementById('pbar-fill').style.width = prog.pct + '%';
  document.getElementById('pbar-count').textContent = prog.done + ' / ' + prog.total + ' solved';

  document.getElementById('f-diff').onchange  = e => { state.diff  = e.target.value; render(); };
  document.getElementById('f-topic').onchange = e => { state.topic = e.target.value; render(); };
  document.getElementById('reset-ch').onclick = () => {
    all.forEach(p => { delete state.solved[p.id]; });
    saveProgress(); render();
  };

  if(!shown.length){
    list.innerHTML = '<p class="empty">No problems match those filters.</p>';
    return;
  }

  shown.forEach(p => {
    const card = document.createElement('div');
    card.className = 'prob' + (state.solved[p.id] ? ' done' : '');

    const head = document.createElement('div');
    head.className = 'prob-head';
    head.innerHTML =
      '<span class="prob-num">' + p.id + '</span>' +
      (p.difficulty ? '<span class="tag ' + p.difficulty + '">' + p.difficulty + '</span>' : '') +
      (p.topic ? '<span class="tag">' + p.topic + '</span>' : '');
    card.appendChild(head);

    const body = document.createElement('div');
    body.className = 'prob-body';
    card.appendChild(body);

    const prompt = document.createElement('div');
    body.appendChild(prompt);

    const acts = document.createElement('div');
    acts.className = 'prob-actions';
    body.appendChild(acts);

    const ansBox = document.createElement('div');
    ansBox.className = 'reveal hidden';
    ansBox.innerHTML = '<h4>Answer</h4><div class="ans-body"></div>';
    body.appendChild(ansBox);

    const expBox = document.createElement('div');
    expBox.className = 'reveal expert hidden';
    expBox.innerHTML = '<h4>How an expert sees it</h4><div class="exp-body"></div>';
    body.appendChild(expBox);

    const solBox = document.createElement('div');
    solBox.className = 'reveal hidden';
    solBox.innerHTML = '<h4>Full solution</h4><div class="sol-body"></div>';
    body.appendChild(solBox);

    if(p.hint){
      const hintBtn = document.createElement('button');
      hintBtn.className = 'act';
      hintBtn.textContent = 'Hint';
      const hintBox = document.createElement('div');
      hintBox.className = 'reveal hidden';
      hintBox.innerHTML = '<h4>Hint</h4><div class="hint-body"></div>';
      body.insertBefore(hintBox, ansBox);
      hintBtn.onclick = () => {
        hintBox.classList.toggle('hidden');
        if(!hintBox.dataset.rendered){
          fill(hintBox.querySelector('.hint-body'), p.hint);
          hintBox.dataset.rendered = '1';
        }
      };
      acts.appendChild(hintBtn);
    }

    const ansBtn = document.createElement('button');
    ansBtn.className = 'act';
    ansBtn.textContent = 'Show answer';
    ansBtn.onclick = () => {
      ansBox.classList.toggle('hidden');
      ansBtn.textContent = ansBox.classList.contains('hidden') ? 'Show answer' : 'Hide answer';
      if(!ansBox.dataset.rendered){
        fill(ansBox.querySelector('.ans-body'), p.answer);
        ansBox.dataset.rendered = '1';
      }
    };
    acts.appendChild(ansBtn);

    if(p.expert){
      const expBtn = document.createElement('button');
      expBtn.className = 'act expert';
      expBtn.textContent = 'How an expert sees it';
      expBtn.onclick = () => {
        expBox.classList.toggle('hidden');
        expBtn.textContent = expBox.classList.contains('hidden')
          ? 'How an expert sees it' : 'Hide expert view';
        if(!expBox.dataset.rendered){
          fill(expBox.querySelector('.exp-body'), p.expert);
          expBox.dataset.rendered = '1';
        }
      };
      acts.appendChild(expBtn);
    }

    const solBtn = document.createElement('button');
    solBtn.className = 'act';
    solBtn.textContent = 'Show full solution';
    solBtn.onclick = () => {
      solBox.classList.toggle('hidden');
      solBtn.textContent = solBox.classList.contains('hidden') ? 'Show full solution' : 'Hide full solution';
      if(!solBox.dataset.rendered){
        fill(solBox.querySelector('.sol-body'), p.solution);
        solBox.dataset.rendered = '1';
      }
    };
    acts.appendChild(solBtn);

    const doneBtn = document.createElement('button');
    doneBtn.className = 'act' + (state.solved[p.id] ? ' done' : '');
    doneBtn.textContent = state.solved[p.id] ? 'Solved' : 'Mark as solved';
    doneBtn.onclick = () => {
      if(state.solved[p.id]) delete state.solved[p.id];
      else state.solved[p.id] = true;
      saveProgress(); render();
    };
    acts.appendChild(doneBtn);

    list.appendChild(card);
    fill(prompt, p.prompt);
  });
}

function renderReference(main){
  const h = document.createElement('h2');
  h.className = 'chap';
  h.textContent = REFERENCE.title || 'Reference';
  main.appendChild(h);
  if(REFERENCE.subtitle){
    const sub = document.createElement('div');
    sub.className = 'chap-sub';
    sub.textContent = REFERENCE.subtitle;
    main.appendChild(sub);
  }
  (REFERENCE.sections || []).forEach((sec, i) => {
    const d = document.createElement('details');
    d.className = 'guide-sec';
    if(i === 0) d.open = true;
    const s = document.createElement('summary');
    const chev = document.createElement('span');
    chev.className = 'chev';
    chev.textContent = '▾';
    const label = document.createElement('span');
    label.className = 'sum-text';
    s.appendChild(chev); s.appendChild(label);
    d.appendChild(s);
    const body = document.createElement('div');
    body.className = 'guide-body';
    d.appendChild(body);
    main.appendChild(d);
    fillInline(label, sec.title);
    fill(body, sec.body);
  });
}

function renderHome(main){
  const hero = document.createElement('div');
  hero.className = 'home-hero';
  hero.innerHTML =
    '<h2 class="chap" style="margin-bottom:6px">Learn the course in order</h2>' +
    '<p class="lead">Guides, formula sheets, and original worked problems written against Nise, <em>Control Systems Engineering</em>, 7th edition. Study along with lecture rather than ahead of it. Progress stays in this browser.</p>';
  main.appendChild(hero);

  const path = document.createElement('div');
  path.className = 'path';

  const rows = [
    { id:1, label:'Now', title:'Chapter 1 · Introduction', note:'Vocabulary, open vs closed loop, the three design objectives.', tab:'guide' },
    { id:2, label:'Now', title:'Chapter 2 · Modeling in the frequency domain', note:'Laplace, transfer functions, impedances, linearization. Sections 2.1–2.5 and 2.10–2.11.', tab:'guide' },
    { id:4, label:'Next', title:'Chapter 4 · Time response', note:'Poles as behavior. First- and second-order specs. Sections 4.1–4.8.', tab:'guide' },
    { id:null, label:'Later', title:'Chapter 5 · Block diagrams, briefly', note:'5.1–5.3 now; a fuller pass after Chapter 4. Not written yet.', tab:null },
    { id:null, label:'Later', title:'Chapter 6 · Stability', note:'Routh–Hurwitz. Not written yet.', tab:null },
    { id:null, label:'Later', title:'Chapter 7 · Steady-state error', note:'Sections 7.1–7.4. Not written yet.', tab:null },
    { id:null, label:'Later', title:'Chapters 8–11 · Design', note:'Root locus 8.1–8.7, design 9.1–9.4, frequency response 10.1–10.7, then 11.', tab:null },
    { id:null, label:'End', title:'Chapters 3 and 12 · State space', note:'Skipped at first. Return at the end of the semester if time allows.', tab:null }
  ];

  rows.forEach(row => {
    const el = document.createElement('div');
    el.className = 'path-row';
    const idx = CHAPTERS.findIndex(c => c.id === row.id);
    el.innerHTML =
      '<div class="wk">' + row.label + '</div>' +
      '<div class="what">' + row.title + '<small>' + row.note + '</small></div>' +
      '<div class="go">' + (idx >= 0 ? 'Open →' : 'Soon') + '</div>';
    if(idx >= 0){
      el.onclick = () => {
        state.view = 'chapter'; state.chapter = idx; state.tab = row.tab || 'guide';
        render(); window.scrollTo(0,0);
      };
    }
    path.appendChild(el);
  });
  main.appendChild(path);
}

function syncHash(){
  let hash = '#/';
  if(state.view === 'home') hash = '#/';
  else if(state.view === 'reference') hash = '#/ref';
  else {
    const ch = CHAPTERS[state.chapter];
    hash = '#/ch/' + (ch ? ch.id : 1) + '/' + state.tab;
  }
  if(location.hash !== hash) history.replaceState(null, '', hash);
}

function applyHash(){
  const raw = (location.hash || '#/').replace(/^#/, '');
  const parts = raw.split('/').filter(Boolean);
  if(!parts.length){ state.view = 'home'; return; }
  if(parts[0] === 'ref'){ state.view = 'reference'; return; }
  if(parts[0] === 'ch'){
    const id = Number(parts[1]);
    const idx = CHAPTERS.findIndex(c => c.id === id);
    if(idx >= 0){
      state.view = 'chapter';
      state.chapter = idx;
      if(parts[2] === 'guide' || parts[2] === 'formulas' || parts[2] === 'problems') state.tab = parts[2];
    }
  }
}

function render(){
  renderNav();
  const main = document.getElementById('main');
  main.innerHTML = '';

  if(state.view === 'home'){
    renderHome(main);
    syncHash();
    return;
  }

  if(state.view === 'reference' && REFERENCE){
    renderReference(main);
    syncHash();
    return;
  }

  if(!CHAPTERS.length){
    main.innerHTML = '<p class="empty">No chapters loaded. Add a file in <code>chapters/</code> and a matching script tag in index.html.</p>';
    return;
  }

  const ch = CHAPTERS[state.chapter];
  const h = document.createElement('h2');
  h.className = 'chap';
  h.textContent = 'Chapter ' + ch.id + ': ' + ch.title;
  main.appendChild(h);

  if(ch.sections){
    const sub = document.createElement('div');
    sub.className = 'chap-sub';
    sub.textContent = 'Sections covered: ' + ch.sections;
    main.appendChild(sub);
  }

  renderTabs(main, ch);
  if(state.tab === 'guide')         renderGuide(main, ch);
  else if(state.tab === 'formulas') renderFormulas(main, ch);
  else                              renderProblems(main, ch);
  syncHash();
}

document.getElementById('search').addEventListener('input', e => {
  state.query = e.target.value;
  if(state.query){ state.view = 'chapter'; state.tab = 'problems'; }
  render();
});

document.getElementById('theme-btn').onclick = () => {
  applyTheme(document.documentElement.classList.contains('dark') ? 'light' : 'dark');
};

document.getElementById('menu-btn').onclick = () => {
  document.getElementById('nav').classList.toggle('open');
  document.getElementById('backdrop').classList.toggle('show');
};
document.getElementById('backdrop').onclick = closeNav;

window.addEventListener('hashchange', () => { applyHash(); render(); });

loadProgress();
applyHash();
window.addEventListener('DOMContentLoaded', render);
if(document.readyState !== 'loading') render();
</script>
